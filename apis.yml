aid: swan
name: Swan
description: >-
  Swan is a European banking-as-a-service (BaaS) and embedded-finance platform
  that lets software companies embed banking features -- business accounts with
  native IBANs, physical and virtual card programs, SEPA payments, direct
  debits, and white-labelled onboarding -- directly into their products through
  a single GraphQL API. Swan operates as a licensed electronic money
  institution authorised by France's ACPR (identifier 86245); client deposits
  are safeguarded with BNP Paribas and covered by the French FGDR deposit
  guarantee. Developers integrate via an OAuth 2.0 protected Partner GraphQL API
  (sandbox and live), a Testing API and Event Simulator for end-to-end sandbox
  testing, webhooks for external events, and first-party React/React Native
  tooling. Swan has issued over one million cards and serves platforms across
  accounting, treasury, proptech, HR-tech and travel.
