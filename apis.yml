apis:
- name: Swan Partner API
  description: >-
    Swan's Partner API is a GraphQL API for embedding banking: accounts and
    account holders, memberships, cards, SEPA credit transfers and direct
    debits, standing orders, merchant payments, onboarding, and consent. It is
    protected with OAuth 2.0 bearer authentication (project access tokens via
    client_credentials, user access tokens via authorization_code) and offers
    matching sandbox and live environments plus a Testing API for simulation.
